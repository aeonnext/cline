version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      rebase-strategy: "auto"
      groups:
          all-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
      commit-message:
          prefix: "chore"
          include: "scope"

